  # ── Fortress ────────────────────────────────────────────────────────────

  - id: stonefield
    spot: q
    title: Stonefield
    intro: >
      A stony island nobody has bothered to settle. Claim it, town by town,
      and learn what a Fortress does with neutral ground.
    objective: {type: vp, vp: 6, rounds: 6}
    spotlight: [fortress_slow_advance]
    hints:
      - Explore claims open land next to yours. Every 3 tiles you hold are worth 1 VP.
      - Stony land has defense 1 and walled towns more — Explore can't take them, but Mountaineer hits neutral land with power 4.
      - A wall of stony ground (defense 1) shuts in your valley — you won't get far with Explore alone.
    cards: {pack: first_clash}
    map:
      name: Stonefield
      layout: |2
              *
            .   .
          .   .   .
        #   1   .   #
          .   1   .
