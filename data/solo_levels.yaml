    cards: {pack: first_clash}
    variants:
      fortress:
        title: The Siege
        intro: >
          Your keep stands behind a ring of old walls, and two Vanguard
          warlords have camped at its gates. Hold out until the season ends
          with at least 5 tiles: if they raid your keep even once, or take
          more than 5 of your tiles, it has fallen.
        objective: {type: survive, rounds: 10, tiles_lost_max: 5, tiles: 5}
        spotlight: [fortress_iron_wall, fortress_garrison]
        bots:
          - {archetype: vanguard, difficulty: hard, name: Warlord}
          - {archetype: vanguard, difficulty: hard, name: Reaver}
        hints:
          - A raid needs more power than your base's defense of 3 plus any defense you play on it.
          - Iron Wall makes a tile impossible to claim this round; Garrison defends an owned tile with power 6.
          - The walls around the keep have defense 2. Claim them first (Mountaineer hits neutral land with power 4), and the raiders have to break them to reach you.
      vanguard:
        title: Storm the Keep
        seat: B
        intro: >
          A Fortress has dug in behind a ring of old walls at the heart of the
          island. Break through and raid the keep — the same siege, from the
          other side.
        objective: {type: raid, rounds: 8}
        spotlight: [neutral_siege_tower]
        bots:
          - {archetype: fortress, difficulty: hard, name: Castellan}
        hints:
          - The keep has defense 3, plus whatever the Castellan plays on it. Siege Tower hits for 6.
          - The walls have defense 2 — and more once the Castellan holds them. Break one to get next to the keep.

