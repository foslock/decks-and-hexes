  - id: hold_the_pass
    spot: t
    title: Hold the Pass
    intro: >
      A mountain wall splits the valley, with a single pass through it — and
      a warband is coming down from the north. Hold your land.
    objective: {type: survive, rounds: 10, tiles_lost_max: 2, tiles: 12}
    spotlight: [fortress_iron_wall, neutral_watchtower]
    bots:
      - {archetype: vanguard, difficulty: hard, name: Warband}
    hints:
      - Every tile the warband takes from you counts; lose more than 2 and the pass has fallen.
      - Watchtower adds 2 defense to a tile for the round; Iron Wall makes a tile impossible to claim this round.
      - The pass has defense 1. Hold it and they can't reach the valley except through you.
      - Farm walls (defense 1) ring your castle, and you need 12 tiles at the end — Levy or Mountaineer gets you through them.
