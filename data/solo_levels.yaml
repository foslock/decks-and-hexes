  - id: land_bridge
    spot: l
    title: The Land Bridge
    intro: >
      Two islands joined by a narrow causeway, and your first rival on the far
      shore. The town in the middle of the bridge is worth fighting for — but
      walls guard both ends of the crossing.
    objective: {type: vp, vp: 9, rounds: 10}
    hints:
      - Your rival wins the level by reaching the VP target first.
      - Explore can't cross the walled ends of the bridge.
      - Your base has defense 3; a raid on it costs you a Rubble and gives the raider a VP.
    cards: {pack: first_clash}
    bots:
      - {archetype: swarm, difficulty: easy, name: Marauder}
    map:
