  - id: long_march
    spot: s
    title: The Long March
    intro: >
      A long, narrow island with its towns strung out to the far end. Walled
      crossings slow the march north. Hold every town at once.
    objective: {type: vp_hexes, rounds: 15}
    spotlight: [fortress_slow_advance]
    hints:
      - Tiles marked with defense can't be Explored; bring Claims to break through.
      - Mountaineer hits neutral land with power 4 — more than any town here has.
      - Nobody else is here, so towns you take stay yours.
    cards: {pack: far_reaches}
