          #   .   .   #
        1   .   .   .   1
          .   .   .   .
        .   .   1   .   .
          .   1   1   .
        .   1   .   1   .
          1   .   .   1
            .   a   .
              .   .
                A

  - id: island_hopping
    spot: k
    title: Island Hopping
    intro: >
      Four undefended towns sit on islets out at sea, beyond the reach of any
      ordinary Claim. A swarm doesn't need roads. Hold all four at once.
    objective: {type: vp_hexes, rounds: 10}
    spotlight: [swarm_proliferate]
    hints:
      - Claims need a tile of yours next to the target — the sea is in the way.
      - Proliferate claims any neutral tile on the board, ignoring adjacency.
      - The towns have no defense; once you're on an islet you can spread from there.
    cards: {pack: far_reaches}
    map:
      name: Island Hopping
      legend:
