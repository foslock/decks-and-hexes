          .   .   .
        .   .   .   .
          1   a   1
            .   .
              A

  - id: the_bulwark
    spot: r
    title: The Bulwark
    intro: >
      Old stone walls dot the hills around your castle. Take them, and build
      them up until three of them stand at defense 4.
    objective: {type: fortify, tiles: 3, defense: 4, rounds: 12}
    spotlight: [neutral_fortified_post]
    hints:
      - The old walls have defense 2 of their own. Barricade adds 2 more for good — until someone takes the tile.
      - Barricade bonuses stack — two on the same tile add 4.
      - Mountaineer claims neutral land with power 4, walls included.
    cards: {pack: first_clash}
    map:
